name: CI

# WHY THIS IS A SEPARATE WORKFLOW FROM refresh.yml.
#
# refresh.yml rebuilds the dataset and commits it, and its commit step is gated on the test suite.
# That gate is right for tests about the DATA: a collapsed parse must never reach production. It
# is wrong for everything else. On 2026-09-21 a test whose assertion was simply false began
# failing, the commit was skipped, and the live dashboard served the same figures for eleven days
# while the pipeline built correctly every single morning.
#
# The lesson is not "add more gates to the refresh". It is that the set of things able to freeze
# publication must be as small as the job that publishes. So the frontend — which the refresh
# workflow does not build, deploy or depend on — is tested here instead, on push and pull request,
# where a failure is loud and immediate and cannot stop the data from updating.
#
# This also keeps refresh.yml toolchain-free: the pipeline is stdlib-only by design, and the
# scheduled run still installs nothing but pytest.
#
# WHY THERE IS A workflow_run TRIGGER.
#
# All of the above was true and this workflow still never ran on a single dataset commit.
# Between 2026-10-02 and 2026-10-15 the refresh bot pushed fourteen times and CI fired zero
# times, because GitHub does not trigger `push` workflows for pushes authenticated with the
# default GITHUB_TOKEN — a loop guard, and a reasonable one. The consequence here was that the
# one job built to test the COMMITTED tree was structurally unreachable on the only commits
# nobody reviews. It would have caught the stale docs/CURRENT_STATE.md on 2026-09-05 and every
# day after.
#
# `workflow_run` is not subject to that suppression: it fires when another workflow completes,
# whoever pushed. So the committed tree is now checked after every refresh, on the commit the
# refresh actually made. A failure here is loud and cannot stop the data from updating, which
# is the whole point of this file being separate.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_run:
    workflows: ["Refresh dataset"]
    types: [completed]
  workflow_dispatch:

concurrency:
  # workflow_run events carry the triggering workflow's ref, so keying on github.ref alone
  # would let a refresh-triggered run cancel a human push to the same branch.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # data_quality derives curated-source dates from `git log`, which a shallow clone
          # cannot answer: at depth 1 every curated file reports the tip commit's date and the
          # payload publishes a provenance date that is simply wrong.
          fetch-depth: 0
          # On a workflow_run event the default checkout is the ref the EVENT points at, which
          # for a refresh is the commit that triggered the refresh — the parent, not the commit
          # the refresh made. Checking the parent would pass while the new commit was broken.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: pip install pytest

      # Deliberately NO `pipeline.run` here.
      #
      # data/processed is committed, so the suite asserts on the bytes that actually ship — which
      # is better than asserting on a payload the job just built for itself. And the first version
      # of this workflow DID build: five pushes in one hour became five cold full fetches of
      # Wikipedia and Overpass, and run #2 failed inside the fetch rather than in anything it was
      # testing. Hammering free public endpoints on every push is not a reasonable way to find out
      # whether a test passes.
      #
      # The few tests that genuinely need a build or a live request are opt-in behind
      # RUN_BUILD_TESTS and run in refresh.yml, which builds anyway and keeps a data/raw cache.
      - name: Test against the committed payload
        run: python -m pytest

      - name: The payload must be present, or the suite skipped most of itself
        # ~136 tests are guarded on their artifact existing. Without this, a checkout missing the
        # committed payload would skip them and report green.
        run: |
          test -f data/processed/snapshot.json
          test -f web/public/data/snapshot.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm run test

      # Vercel builds this on deploy, so a build break is a deploy break. Catching it here means
      # finding out on push rather than on a production rollout.
      - name: Build
        working-directory: web
        run: npm run build

  # The real-browser tier (iteration 14). Unit tests run in node with no DOM and no WebGL, and
  # iterations 11, 12 and 13 each shipped a defect only a browser could see — the last of them a
  # map-focus grid that gave the map zero height for four weeks under a green suite. This job
  # serves the production build and drives real Chromium against the committed payload.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser tests against the production build
        working-directory: web
        run: npm run e2e

      - name: Keep the report and traces when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/e2e-report
            web/e2e-results
          retention-days: 14
