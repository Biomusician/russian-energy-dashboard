name: Refresh dataset

# Rebuilds the dataset from public sources and commits the result. Vercel redeploys
# on the resulting push, so the live dashboard updates without a separate deploy step.
on:
  schedule:
    # 05:20 UTC daily. Deliberately off the hour: scheduled runs cluster on the hour
    # across GitHub and get queued.
    - cron: "20 5 * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Ignore the on-disk source cache"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # data_quality dates the curated CSVs from `git log -1`, which a shallow clone cannot
          # answer. At the default depth of 1 every curated source reported the tip commit's date
          # — the 2026-09-20 payload published "retrieved 2026-09-19, 1 day old" for files last
          # genuinely edited on 2026-08-29. A provenance date that is wrong is worse than absent.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The pipeline is stdlib-only by design, so there is nothing to install and no
      # wheel that can break the scheduled run.
      - name: Cache upstream downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: Clear cache if forced
        if: inputs.force_refresh
        run: rm -rf data/raw

      - name: Build dataset
        run: python -m pipeline.run

      - name: Install test dependency
        run: pip install pytest

      - name: Test
        # RUN_BUILD_TESTS enables the determinism and live-request tests, which ci.yml
        # skips. This job has already fetched and holds a warm data/raw cache, so running
        # them here costs nothing extra and keeps them exercised daily.
        env:
          RUN_BUILD_TESTS: "1"
        run: python -m pytest

      - name: Commit if data changed
        run: |
          git config user.name  "dataset-refresh[bot]"
          git config user.email "dataset-refresh[bot]@users.noreply.github.com"
          # Skip the commit when the only difference from HEAD is the wall-clock
          # build_time — a same-day rerun with no real data change must not produce an
          # empty "daily refresh" commit. Legitimate daily drift (as_of, recency-weighted
          # index) still counts as a change.
          if ! python scripts/ci_data_changed.py; then
            echo "No substantive dataset change — skipping commit."
            exit 0
          fi
          git add data/processed web/public/data
          ESDI=$(python -c "import json;print(json.load(open('data/processed/snapshot.json',encoding='utf-8'))['esdi'])")
          N=$(python -c "import json;print(json.load(open('data/processed/snapshot.json',encoding='utf-8'))['incident_total'])")
          git commit -m "data: daily refresh $(date -u +%Y-%m-%d) — ESDI ${ESDI}, ${N} events"
          git push
